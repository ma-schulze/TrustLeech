[package]
name = "aarch64"
version = "0.1.0"
authors = ["Andrew Walbran <qwandor@google.com>"]
edition = "2021"

[features]
tcp = ["smoltcp"]
default = ["tcp"]

[lib]
crate-type = ["staticlib"]

[dependencies]
aarch64-rt = "0.1.0"
aarch64-paging = "0.8.0"
arm-pl011-uart = "0.3.0"
buddy_system_allocator = "0.11.0"
flat_device_tree = "3.1.1"
log = "0.4.27"
safe-mmio = "0.2.4"
smccc = "0.2.0"
spin = "0.10.0"
virtio-drivers = { path = "../.." }
elliptic-curve = "0.13.8"
ecdsa = "0.16.9"
p256 = { version = "0.13.2",  default-features = false, features = ["ecdsa", "arithmetic", "ecdh"] }
rand_core = { version = "0.6", default-features = false, features = []}
# getrandom = { path = "../../../rs_random/" }
generic-array = "0.14.7"
# AES encryption also needs to disable std features
aes = { version = "0.8.4", default-features = false }
ctr = "0.9.2"  
# Use hex-literal - check for no_std compatibility
hex-literal = { version = "0.3", default-features = false }

[dependencies.smoltcp]
version = "0.9.1"
optional = true
default-features = false
features = [
  "alloc", "log",   # no std
  "medium-ethernet",
  "proto-ipv4",
  "socket-raw", "socket-icmp", "socket-udp", "socket-tcp", "verbose"
]

[dependencies.lazy_static]
version = "1.5.0"
features = ["spin_no_std"]
